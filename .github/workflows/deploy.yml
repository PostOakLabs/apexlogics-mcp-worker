# ─────────────────────────────────────────────────────────────────────────────
# Pre-flight + Deploy — ApexLogics MCP Worker
#
# Deploy is a standalone job in this same workflow (see `deploy:` below) using
# `cloudflare/wrangler-action@v3` with repo secrets CLOUDFLARE_API_TOKEN +
# CLOUDFLARE_ACCOUNT_ID — the runbook §6 standardized method, not Cloudflare's
# GitHub App. (Corrected 2026-07-30 — this comment previously described an
# older GitHub-App-based design; the workflow itself was already updated to
# the wrangler-action method, the comment just never caught up.)
#
# Triggers
#   • Push to master → preflight runs, then deploy (gated on preflight passing)
#   • Pull request    → preflight only, no deploy
#   • workflow_dispatch → manual trigger; dry_run skips the fixture staleness check
# ─────────────────────────────────────────────────────────────────────────────

name: Pre-flight — MCP Worker

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — generate and verify fixtures only, skip staleness check"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Generate & verify fixtures
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ── JS syntax gate ──────────────────────────────────────────────────────
      # node --check parses every .mjs in the repo without executing it.
      # Runs before generate.mjs so a bad kernel fails fast (no network call).
      # Does not require CF credentials.
      - name: 🔍 JS syntax gate — worker + all kernels
        run: |
          fail=0
          for f in worker.mjs pilot.mjs _hash.mjs run_chain.mjs generate.mjs; do
            node --check "$f" || { echo "::error::Syntax error in $f"; fail=1; }
          done
          for f in kernels/*.kernel.mjs; do
            node --check "$f" || { echo "::error::Syntax error in $f"; fail=1; }
          done
          [ "$fail" -eq 0 ] && echo "✅ All .mjs files pass syntax check" || exit 1

      # ── /mcp wire contract (AL-MCP-728-B) ───────────────────────────────────
      # BLOCKING. Invokes the Worker's fetch handler directly against the committed
      # ./data fixtures, so the SEP-2243 header rules, the 2026-07-28 era gating,
      # per-request _meta enforcement, error shapes and the 405s are checked BEFORE
      # anything deploys. Nothing else in this workflow exercises the /mcp wire.
      # Every modern-era rejection is paired with a legacy control, so a change that
      # strands old clients fails here rather than in the field.
      # --self-test re-runs the whole suite against a worker with SEP-2243 validation
      # disabled and fails if the suite stays green — a gate that has never failed is
      # not known to work. Zero-dep, no CF creds, no network.
      - name: 🔒 SEP-2243 + 2026-07-28 wire gate (offline)
        run: node scripts/gate-mcp-era.mjs --self-test

      # ── §17 compute-images freshness ────────────────────────────────────────
      # Asserts each kernel-backed node's sha256-source stamp equals the sha256 of
      # its LF-normalized kernel source, so run_chain's build_identity never
      # publishes a stale digest. Zero-dep; no CF creds. See .gitattributes eol=lf.
      - name: 🔒 §17 compute-images freshness gate
        run: node scripts/check-compute-images.mjs

      # ── §12 chain composite freeze ──────────────────────────────────────────
      # Recomputes every frozen chain's composite_execution_hash via run_chain and
      # compares to data/chain-goldens.json. Catches a kernel/chain/gate change that
      # would silently alter a composite. Zero-dep, no CF creds, no network.
      - name: 🔒 §12 chain-freeze gate
        run: node scripts/chain-freeze.mjs

      # ── §21.4 decision-gate suite ───────────────────────────────────────────
      # gate-semantics: pinned vector suite for the shared _gateval evaluator
      # (ops × types × first-match × default × determinism × tamper-detect).
      # gate-branch-coverage: proves every gate branch is drivable and the
      # coverage checker flags any uncovered branch (synthetic mock chain).
      # validate-chains: static gate validation over the catalog + LIVE branch
      # coverage — every GATED chain's branch-fixtures must drive every branch
      # through the real run_chain loop. Zero-dep, no CF creds, no network.
      - name: 🔒 §21.4 gate-semantics vectors
        run: node scripts/gate-semantics.test.mjs
      - name: 🔒 §21.4 gate branch-coverage mechanism
        run: node scripts/gate-branch-coverage.test.mjs
      - name: 🔒 §21.4 chain + live branch-coverage validation
        run: node scripts/validate-chains.mjs

      # ── §18 compute-proof binding ───────────────────────────────────────────
      # Re-binds every embedded zk compute_proof to its kernel: ImageID a1a0bc89 +
      # journal.output == compute(proven inputs). Catches an output-changing kernel
      # edit that would leave a stale proof. Zero-dep, no GPU, no network.
      - name: 🔒 §18 compute-proof binding gate
        run: node scripts/check-compute-proofs.mjs

      # ── Generate fixtures ───────────────────────────────────────────────────
      # Fetches live suite-registry.json from apexlogics.org and writes
      # data/tools.json + data/workflows.json. Confirms the registry is reachable.
      - name: Generate data fixtures
        run: node generate.mjs

      # ── Verify fixture sanity ───────────────────────────────────────────────
      - name: Verify fixtures
        run: |
          if [ ! -f data/tools.json ] || [ ! -f data/workflows.json ]; then
            echo "::error::generate.mjs did not produce expected fixtures"
            exit 1
          fi
          TOOL_COUNT=$(python3 -c "import json; d=json.load(open('data/tools.json')); print(len(d))")
          WF_COUNT=$(python3 -c "import json; d=json.load(open('data/workflows.json')); print(len(d))")
          echo "✅ data/tools.json — $TOOL_COUNT tools"
          echo "✅ data/workflows.json — $WF_COUNT workflow chains"
          if [ "$TOOL_COUNT" -lt 50 ]; then
            echo "::error::Only $TOOL_COUNT tools in fixture — expected ≥50. Registry fetch may have failed."
            exit 1
          fi

      # ── Staleness check ─────────────────────────────────────────────────────
      # Warns (does not fail) if committed data/ differs from freshly generated
      # fixtures. A diff here means generate.mjs wasn't re-run before this push.
      - name: Check fixture staleness
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if ! git diff --quiet data/; then
            echo "::warning::Committed data/ differs from freshly generated fixtures."
            echo "::warning::Run 'node generate.mjs', commit data/, and push to keep fixtures fresh."
            git diff --stat data/
          else
            echo "✅ Committed fixtures match fresh generation — up to date."
          fi

      # ── Summary ─────────────────────────────────────────────────────────────
      - name: Pre-flight summary
        if: always()
        run: |
          TOOL_COUNT=$(python3 -c "import json; d=json.load(open('data/tools.json')); print(len(d))" 2>/dev/null || echo "N/A")
          WF_COUNT=$(python3 -c "import json; d=json.load(open('data/workflows.json')); print(len(d))" 2>/dev/null || echo "N/A")
          {
            echo "## MCP Worker pre-flight summary"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Tools in fixture | $TOOL_COUNT |"
            echo "| Workflow chains | $WF_COUNT |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Cloudflare deploy | via deploy job below (GitHub Actions) |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Deploy ────────────────────────────────────────────────────────────────
  # Real deploy via GitHub Actions + wrangler-action (NOT a Cloudflare GitHub
  # App). Gated on preflight, master pushes only. A failed deploy leaves the
  # live worker untouched. Needs repo secrets CLOUDFLARE_API_TOKEN (scoped to
  # this account + the apexlogics.org zone) and CLOUDFLARE_ACCOUNT_ID.
  deploy:
    name: Deploy to Cloudflare Workers
    needs: preflight
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"          # Wrangler 4.99 requires Node >=22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate data fixtures
        run: node generate.mjs        # refresh tools.json/workflows.json from the live registry

      # ── Bundle dry-run ───────────────────────────────────────────────────────
      # wrangler deploy --dry-run bundles the worker (esbuild + miniflare checks)
      # without uploading anything. Catches import errors, missing modules, and
      # bundle-size violations that node --check cannot see. Runs with real CF
      # credentials so wrangler can resolve bindings, but makes no live change.
      - name: 🔨 Bundle dry-run (wrangler deploy --dry-run)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4.99.0 deploy --dry-run --outdir /tmp/worker-bundle
          echo "✅ Worker bundle OK — no upload"

      - name: Deploy worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.99.0"
          command: deploy

      # ── Post-deploy /mcp wire smoke (AL-MCP-728-B, pinned per AL-SMOKE-PIN) ──
      # BLOCKING. The same rules the offline gate proves against source, re-proven
      # against the LIVE endpoint — the only place the Cloudflare edge, the WAF and
      # the custom-domain route are in the path. A WAF rule that strips or blocks
      # Mcp-Method / Mcp-Name turns every modern client into a 400 while worker.mjs
      # stays perfectly conformant; round-tripping the headers through a real request
      # is the only check that can see that. Red here → roll back in Cloudflare.
      #
      # `wrangler deploy`'s stdout ("Current Version ID: <uuid>") is parsed here and
      # passed to the smoke script, which polls /healthz's deployed_version field
      # until THIS id answers, then runs the assertions exactly once. Without this,
      # a partially-propagated edge makes "eventually something answered correctly"
      # indistinguishable from a broken deploy answering correctly by chance.
      - name: 🔌 Post-deploy /mcp wire smoke
        run: |
          VERSION_ID=$(printf '%s\n' "${{ steps.deploy.outputs.command-output }}" | grep -oE 'Current Version ID: [0-9a-f-]+' | awk '{print $NF}')
          if [ -z "$VERSION_ID" ]; then
            echo "::error::could not parse Current Version ID from wrangler deploy output — see command-output above"
            printf '%s\n' "${{ steps.deploy.outputs.command-output }}"
            exit 1
          fi
          echo "Pinning smoke to deployed Version ID: $VERSION_ID"
          MCP_SMOKE_VERSION_ID="$VERSION_ID" node scripts/smoke-mcp.mjs
